# Pages CMS (https://pagescms.org): edit posts from a browser or phone.
# It edits the same Markdown files in this repo, through GitHub.

media:
  input: public/images
  output: /images
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields: [title, date, type, draft]
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, description: 'One sentence. Optional for notes.' }
      - { name: date, label: Date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: type, label: Type, type: select, default: essay, options: { values: [essay, note, link] } }
      - { name: link, label: Link (link posts only), type: string }
      - name: topics
        label: Topics
        type: select
        options:
          multiple: true
          values: [design, development, product, marketing, fitness, communication, networking]
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: body, label: Text, type: code, options: { format: markdown } }

  - name: about
    label: About
    type: file
    path: content/pages/about.md
    format: yaml-frontmatter
    fields: &page
      - { name: title, type: string, required: true }
      - { name: description, type: text }
      - { name: updated, type: date, options: { format: yyyy-MM-dd } }
      - { name: body, label: Text, type: code, options: { format: markdown } }

  - name: now
    label: Now
    type: file
    path: content/pages/now.md
    format: yaml-frontmatter
    fields: *page
