  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("links-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();

  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("/assets/fonts/Satoshi-Medium.woff2") format("woff2");

      font-display: swap;
    }
    @font-face {
      font-family: "Satoshi";
      src: url("/assets/fonts/Satoshi-Black.woff2") format("woff2");
      font-weight: 800 900;
      font-display: swap;
    }
    :root { color-scheme: light; --bg: #f1f4fb; --fg: #1f2023; --muted: #5f636d; --accent: #0025e8; --accent-text: #fff; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #141414; --fg: #f4f4f5; --muted: #a1a1aa; --accent: #ffb5ea; --accent-text: #141414; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { color-scheme: dark; --bg: #141414; --fg: #f4f4f5; --muted: #a1a1aa; --accent: #ffb5ea; --accent-text: #141414; }
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    p { margin: 10px 0 28px; color: var(--muted); }
    a {
      display: inline-flex;
      align-items: center;
      height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      text-decoration: none;
    }

</head>
